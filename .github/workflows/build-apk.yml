name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android-SDK ist auf den GitHub-Runnern bereits installiert.
      # Es gibt keinen Gradle-Wrapper im Repo, daher wird Gradle hier bereitgestellt.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Unit-Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Debug-APK bauen
        if: ${{ !cancelled() }}
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tilt-runner-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
